<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="#040c0c" stroke="#14b8a6" stroke-width="8" stroke-opacity="0.6"/>
  <!-- Decorative Header Band -->
  <rect x="48" y="56" width="416" height="64" rx="16" fill="#020707" stroke="#2dd4bf" stroke-width="3" stroke-opacity="0.4"/>
  <text x="72" y="98" fill="#5eead4" font-family="monospace" font-size="28" font-weight="bold" letter-spacing="4">PASSWORDCARD</text>
  <circle cx="430" cy="88" r="12" fill="#14b8a6"/>
  
  <!-- Grid Matrix Visual -->
  <g fill="#2dd4bf" font-family="monospace" font-size="26" font-weight="bold" text-anchor="middle">
    <!-- Header Symbols Row -->
    <text x="96" y="165" fill="#5eead4">■</text>
    <text x="160" y="165" fill="#5eead4">▲</text>
    <text x="224" y="165" fill="#5eead4">●</text>
    <text x="288" y="165" fill="#5eead4">★</text>
    <text x="352" y="165" fill="#5eead4">♥</text>
    <text x="416" y="165" fill="#5eead4">♫</text>
    
    <!-- Character Rows -->
    <text x="96" y="220" opacity="0.85">7</text>
    <text x="160" y="220" opacity="0.85">x</text>
    <text x="224" y="220" opacity="0.85">K</text>
    <text x="288" y="220" fill="#5eead4">9</text>
    <text x="352" y="220" opacity="0.85">m</text>
    <text x="416" y="220" opacity="0.85">Q</text>
    
    <text x="96" y="275" opacity="0.85">p</text>
    <text x="160" y="275" opacity="0.85">4</text>
    <text x="224" y="275" opacity="0.85">w</text>
    <text x="288" y="275" fill="#5eead4">R</text>
    <text x="352" y="275" opacity="0.85">8</text>
    <text x="416" y="275" opacity="0.85">N</text>
    
    <text x="96" y="330" opacity="0.85">B</text>
    <text x="160" y="330" opacity="0.85">z</text>
    <text x="224" y="330" opacity="0.85">5</text>
    <text x="288" y="330" fill="#5eead4">s</text>
    <text x="352" y="330" opacity="0.85">T</text>
    <text x="416" y="330" opacity="0.85">2</text>
    
    <text x="96" y="385" opacity="0.85">9</text>
    <text x="160" y="385" opacity="0.85">E</text>
    <text x="224" y="385" opacity="0.85">c</text>
    <text x="288" y="385" fill="#5eead4">v</text>
    <text x="352" y="385" opacity="0.85">7</text>
    <text x="416" y="385" opacity="0.85">H</text>
  </g>
  
  <!-- Active Selection Highlight Column -->
  <rect x="264" y="136" width="48" height="270" rx="8" fill="#14b8a6" fill-opacity="0.18" stroke="#5eead4" stroke-width="2"/>
  
  <!-- 5-Minute Timer Emblem Badge -->
  <g transform="translate(196, 420)">
    <rect width="120" height="40" rx="20" fill="#14b8a6" fill-opacity="0.25" stroke="#2dd4bf" stroke-width="2"/>
    <text x="60" y="26" fill="#5eead4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">5 MINS</text>
  </g>
</svg>
